version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: insightlens-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: insightlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SiMaY404

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:

    build: .

    container_name: insightlens-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env.docker

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  postgres_data: